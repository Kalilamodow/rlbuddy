[package]
name = "rlbuddy"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
discord-rich-presence = "1.1.0"
eframe = { version = "0.34.3", features = ["glow", "persistence"] }
num_enum = "0.7.6"
rand = "0.10.2"
rdev = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
webbrowser = "1.2.1"

[dependencies.egui_extras]
version = "0.34.3"
default-features = false
features = ["webp"]

[build-dependencies]
ureq = "3.3.0"
